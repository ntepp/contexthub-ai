# Development infrastructure only (PostgreSQL + Redis). The application runs from
# the virtualenv / Vite dev server — see start.bat / start.sh.
# Production: docker-compose.yaml (full stack).
services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contexthub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Optional local identity provider to try the SSO (OpenID Connect) login:
  #   docker compose -f docker-compose.dev.yaml --profile sso up -d
  # Realm "contexthub" with demo accounts (see deploy/keycloak/README.md). Development
  # only: fixed passwords and client secret, no TLS, in-memory database.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["sso"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The issuer written in tokens: must be what both the browser and the API call.
      KC_HOSTNAME: http://127.0.0.1:8081
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./deploy/keycloak/contexthub-realm.json:/opt/keycloak/data/import/contexthub-realm.json:ro

  # Optional LLM gateway (LiteLLM) to try cost tracking, per-user budgets and the
  # "Consommation" pages:
  #   docker compose -f docker-compose.dev.yaml --profile gateway up -d
  # See deploy/litellm/README.md. Development only: fixed master key, salt key and
  # database password (marked "dev-only"); provider keys are read from the environment
  # (or this folder's .env), never written here.
  litellm-db:
    image: postgres:16-alpine
    profiles: ["gateway"]
    # LiteLLM's own database (keys, budgets, spend logs), separate from ContextHub's. Not published.
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm-dev-only
      POSTGRES_DB: litellm
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 20

  litellm:
    # Pinned release (https://github.com/BerriAI/litellm/releases/tag/v1.106.6): bump deliberately.
    image: ghcr.io/berriai/litellm:v1.106.6
    profiles: ["gateway"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://litellm:litellm-dev-only@litellm-db:5432/litellm
      # Proxy administrator key (also the admin UI password). Development value.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-contexthub-dev-only-master-key}
      # Encrypts credentials stored in the database: never change it once data exists.
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-contexthub-dev-only-salt-key}
      # Provider keys: passed through from your shell or .env, empty when unset.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Ollama running on the host (start.bat / start.sh setup).
      OLLAMA_API_BASE: ${LITELLM_OLLAMA_API_BASE:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux; built in on Docker Desktop
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./deploy/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      litellm-db:
        condition: service_healthy

volumes:
  postgres_data:
  litellm_db_data:
