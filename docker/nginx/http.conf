map $scheme $hsts {
    https   "max-age=31536000";
    default "";
}

# Plain HTTP. Use behind the client's TLS-terminating reverse proxy / load balancer,
# or switch to tls.conf (NGINX_CONF=tls). Without TLS anywhere, set COOKIE_SECURE=false
# — acceptable for an evaluation only.
server {
    listen 80;
    server_name _;
    include /etc/nginx/contexthub/locations.inc;
}
