# ContextHub AI — production stack (single-tenant, on-premise).
#
#   cp .env.production.example .env   # fill in every "change-me"
#   docker compose up -d --build
#   docker compose --profile ollama up -d           # + local LLM (CPU)
#   docker compose -f docker-compose.yaml -f docker-compose.gpu.yaml --profile ollama up -d   # + NVIDIA GPU
#
# Only the "web" service publishes a port. PostgreSQL, Redis, the API, the worker
# and Ollama are reachable only on the internal network.
name: contexthub

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: contexthub/api:${CONTEXTHUB_VERSION:-1.0.0}
  env_file: .env
  environment:
    ENVIRONMENT: production
    POSTGRES_HOST: postgres
    REDIS_HOST: redis
    UPLOAD_DIR: /data/uploads
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  volumes:
    - uploads:/data/uploads
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contexthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-contexthub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD doit être défini dans .env}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  api:
    <<: *app
    command: ["api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *app
    command: ["worker"]

  beat:
    <<: *app
    command: ["beat"]
    volumes: []

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: contexthub/web:${CONTEXTHUB_VERSION:-1.0.0}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/nginx:/etc/nginx/contexthub:ro
      - ./docker/nginx/${NGINX_CONF:-http}.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./docker/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
  ollama:
